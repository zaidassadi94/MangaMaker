name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The whole pipeline must pass with NO secrets configured — the mock provider
# and mock story generator make every step runnable offline.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_PROVIDER: mock
      DATABASE_URL: "file:./data/mangaforge.db"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check for leaked secrets in client bundle
        run: pnpm check:secrets
